version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: clinica_postgres
    restart: always

    environment:
      POSTGRES_DB: clinica_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build: ./backend

    container_name: clinica_backend

    depends_on:
      - postgres

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinica_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

  frontend:

    build: ./frontend

    container_name: clinica_frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data: